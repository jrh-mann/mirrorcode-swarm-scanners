[project]
name = "mirrorcode-swarm-scanners"
version = "0.1.0"
description = "Inspect Scout scanner auditing MirrorCode swarm transcripts per agent"
requires-python = ">=3.11"
dependencies = ["pydantic"]  # inspect-scout + inspect-ai are supplied by the Hawk runner (pinned forks)

[project.entry-points.inspect_ai]
mirrorcode_swarm_scanners = "mirrorcode_swarm_scanners._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirrorcode_swarm_scanners"]
